<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>더빙 작업실</title>
  <link rel="stylesheet" href="styles.css?v=20261113b">   <!-- 파일을 고치면 ?v= 숫자를 바꿔야 폰 등에서 새 파일을 받는다 -->
</head>
<body>
  <header class="topbar">
    <div class="brand">더빙 작업실</div>
    <label class="project-select">작품
      <select id="workSelect" aria-label="작품 선택"></select>
    </label>
    <div class="top-actions">
      <button type="button" id="resetLocal">로컬 수정 초기화</button>
      <span class="save-state" id="saveState">원본 데이터</span>
    </div>
  </header>

  <div class="app-shell">
    <nav class="module-nav" aria-label="주요 메뉴">
      <button class="module-button active" type="button" data-module="대사집">대사집</button>
      <button class="module-button" type="button" data-module="CG">CG</button>
    </nav>

    <aside class="scene-panel" id="dialogueScenePanel">
      <div class="panel-heading"><strong>씬 목록</strong><span id="sceneCount">0</span></div>
      <div class="scene-tools">
        <input id="sceneSearch" type="search" placeholder="씬 ID·종류·대사 ID 검색">
        <select id="sceneTypeFilter" aria-label="씬 종류"><option value="">전체 종류</option></select>
      </div>
      <div class="scene-list" id="sceneList"></div>
      <div class="scene-summary"><span id="totalRows">0개 행</span><span id="voiceRows">음성 0</span></div>
    </aside>

    <main class="workspace" id="dialogueWorkspace">
      <div class="workspace-header">
        <div>
          <div class="breadcrumb"><span id="sceneTypeLabel">-</span> / <span id="sceneBreadcrumb">-</span></div>
          <h1 id="sceneTitle">씬 선택</h1>
          <p id="sceneDetail" class="scene-detail"></p>
        </div>
        <div class="workspace-actions">
          <div class="speaker-legend" id="speakerLegend" aria-label="화자 색상표"></div>
          <span id="visibleCount">0개 표시</span>
        </div>
      </div>

      <div class="stats-strip" id="statsStrip" aria-label="씬 진행 현황"></div>

      <div class="phase-tabs" id="phaseTabs" role="tablist"></div>

      <div class="filterbar">
        <input id="lineSearch" type="search" placeholder="ID·화자·원문·대사·대본 검색">
        <select id="speakerFilter"><option value="">전체 화자</option></select>
        <select id="voiceFilter">
          <option value="">전체 음성 상태</option>
          <option value="checked">음성 체크</option>
          <option value="empty">음성 미체크</option>
        </select>
        <label><input id="scriptOnly" type="checkbox"> 녹음 대본 있음</label>
        <label><input id="missingKorean" type="checkbox"> 한국어 누락</label>
        <label><input id="reviewOnly" type="checkbox"> <svg class="flag-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 14.5V1.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.3 2.3h8.4l-2 3.3 2 3.3H4.3z" fill="currentColor"/></svg> 검수 표시만</label>
        <label class="filter-spacer"><input id="showSource" type="checkbox"> 영어 원문 표시</label>
      </div>

      <div class="selectbar" id="selectBar" role="toolbar" aria-label="녹음 대본 행 선택">
        <button type="button" class="mobile-only" id="mobileScenes" aria-label="씬 목록 열기">☰ 씬</button>
        <button type="button" class="mobile-only primary" id="mobilePrompt" aria-label="프롬프트 패널 열기">프롬프트</button>
        <strong id="selectCount" aria-live="polite">선택 0행</strong>
        <button type="button" id="selVisible">표시된 행 전체</button>
        <button type="button" id="selPhase">현재 단계 전체</button>
        <button type="button" id="selScene">현재 씬 전체</button>
        <button type="button" id="selClear">선택 해제</button>
        <button type="button" id="playAll" title="지금 보이는 줄(단계 탭·필터 반영)의 음성을 위에서부터 차례로 재생 · 다시 누르면 정지">▶ 연속 재생</button>
        <button type="button" class="primary" id="copySelected" title="선택한 줄을 `[프롬프트] 대본` 형식으로, 줄 사이에 빈 줄을 두고 한꺼번에 복사">선택 행 복사</button>
        <button type="button" id="reviewOpen" title="검수 표시한 줄을 모아 복사 (AI에게 전달) · 저장 서버로 열었으면 복사해 온 목록을 붙여 넣어 반영"><svg class="flag-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 14.5V1.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.3 2.3h8.4l-2 3.3 2 3.3H4.3z" fill="currentColor"/></svg> 검수 목록</button>
        <button type="button" id="reviewClear" class="hidden" title="이 브라우저에만 남긴 검수 표시를 모두 지움 (목록을 전달한 뒤에 사용)">내 표시 비우기</button>
        <span class="select-hint" id="selectHint">녹음 대본이 있는 행만 선택됩니다 · 필터를 바꿔도 선택 유지, 씬을 바꾸면 해제</span>
      </div>

      <div class="table-wrap">
        <table class="line-table" id="lineTable">
          <thead>
            <tr id="lineHead"></tr>
          </thead>
          <tbody id="lineTableBody"></tbody>
        </table>
      </div>
      <div class="table-footer"><span id="tableRows">0개 행</span><span>줄을 누르면 프롬프트 대상으로 체크됩니다 (녹음용 대본이 있는 줄만).</span></div>
    </main>

    <aside class="detail-panel" id="dialogueDetailPanel">
      <button type="button" class="mobile-only sheet-close" id="sheetClose">프롬프트 패널 닫기 ▾</button>
      <div class="group-tabs" id="groupTabs" role="tablist" aria-label="프롬프트 분류"></div>
      <div class="panel-pane prompt-form" id="promptPanel">
      <div class="prompt-body">
        <section>
          <div id="editBanner" class="edit-banner hidden"><span id="editText"></span><button type="button" id="editCancel">수정 취소</button></div>
          <div id="templateList" role="group" aria-label="프롬프트 템플릿"></div>
          <p id="promptCombined" class="prompt-combined hidden" aria-live="polite"></p>
          <div id="applyWrap" class="apply-wrap hidden">
            <div class="apply-buttons">
              <button type="button" id="resetPrompt" title="선택한 템플릿과 체크한 줄을 모두 해제합니다 (데이터는 바뀌지 않음)">초기화</button>
              <button type="button" class="primary" id="applyPrompt">적용</button>
            </div>
            <span id="applyNote" class="apply-note"></span>
          </div>
        </section>
      </div>
      </div>
    </aside>

    <section class="cg-view hidden" id="cgView" aria-labelledby="cgTitle">
      <header class="cg-header">
        <div>
          <div class="breadcrumb">로컬 미디어 / CG</div>
          <h1 id="cgTitle">CG 갤러리</h1>
          <p class="scene-detail" id="cgPath">저장 서버에서 CG 폴더를 확인합니다.</p>
        </div>
        <div class="cg-summary"><strong id="cgCount">0장</strong><span id="cgStatus">연결 대기</span></div>
      </header>
      <div class="cg-toolbar">
        <input id="cgSearch" type="search" placeholder="씬·파일명 검색 (예: ev08)">
        <button type="button" id="cgReload">새로고침</button>
        <span>씬을 선택하면 해당 CG를 크게 볼 수 있습니다.</span>
      </div>
      <div class="cg-grid" id="cgGrid"></div>
      <div class="cg-scene hidden" id="cgSceneDetail">
        <div class="cg-scene-bar">
          <button type="button" id="cgBack">← 전체 씬</button>
          <div><strong id="cgSceneTitle">-</strong><span id="cgSceneCount">0장</span></div>
        </div>
        <div class="cg-scene-stage">
          <button type="button" class="cg-stage-nav" id="cgScenePrev" aria-label="이전 CG">‹</button>
          <button type="button" class="cg-stage-image" id="cgSceneOpen" title="원본 크기로 보기"><img id="cgSceneImage" alt=""></button>
          <button type="button" class="cg-stage-nav" id="cgSceneNext" aria-label="다음 CG">›</button>
          <div class="cg-stage-caption"><strong id="cgSceneName"></strong><span id="cgScenePosition"></span></div>
        </div>
        <div class="cg-thumbnails" id="cgThumbnails"></div>
      </div>
      <div class="cg-empty hidden" id="cgEmpty">표시할 CG가 없습니다.</div>
    </section>
  </div>

  <div class="cg-lightbox hidden" id="cgLightbox" role="dialog" aria-modal="true" aria-label="CG 크게 보기">
    <button type="button" class="cg-lightbox-close" id="cgClose" aria-label="닫기">×</button>
    <button type="button" class="cg-lightbox-nav cg-lightbox-prev" id="cgPrev" aria-label="이전 이미지">‹</button>
    <figure>
      <img id="cgLarge" alt="">
      <figcaption><strong id="cgCaption"></strong><span id="cgPosition"></span></figcaption>
    </figure>
    <button type="button" class="cg-lightbox-nav cg-lightbox-next" id="cgNext" aria-label="다음 이미지">›</button>
  </div>


  <dialog class="review-dialog" id="reviewDialog" aria-label="검수 목록">
    <h2><svg class="flag-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 14.5V1.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.3 2.3h8.4l-2 3.3 2 3.3H4.3z" fill="currentColor"/></svg> 검수 목록</h2>
    <p id="reviewHint" class="review-hint"></p>
    <textarea id="reviewText" rows="14" spellcheck="false" aria-label="검수 목록 내용"></textarea>
    <div class="review-actions">
      <button type="button" class="primary" id="reviewCopy">복사</button>
      <button type="button" id="reviewApply" class="hidden" title="붙여 넣은 목록의 검수 표시와 메모를 데이터 파일에 저장">붙여 넣은 목록 반영</button>
      <button type="button" id="reviewClose">닫기</button>
    </div>
  </dialog>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <footer class="statusbar">
    <span class="status-dot"></span><span id="statusText">데이터 연결 대기</span>
    <span class="status-spacer"></span>
    <span id="saveNote">수정 내용은 이 브라우저에만 저장됩니다</span>
  </footer>
  <script src="works/works.js?v=20261113"></script>
  <script src="loader.js?v=20261113"></script>
  <script src="app.js?v=20261113"></script>
</body>
</html>
