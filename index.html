<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project_H 통합관리</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Project_H 통합관리</div>
    <label class="project-select">프로젝트
      <select><option>프로젝트를 선택하세요</option></select>
    </label>
    <div class="top-actions">
      <button type="button">프로젝트 설정</button>
      <button type="button">데이터 백업</button>
      <label class="office-toggle"><input id="officeMode" type="checkbox" checked> 오피스 모드</label>
    </div>
  </header>

  <div class="app-shell">
    <nav class="module-nav" aria-label="주요 메뉴">
      <button class="module-button active" data-module="script">대사집</button>
      <button class="module-button" data-module="voice">음성</button>
      <button class="module-button" data-module="cg">CG</button>
      <button class="module-button" data-module="review">검수</button>
      <button class="module-button" data-module="settings">설정</button>
    </nav>

    <aside class="scene-panel">
      <div class="panel-heading">
        <strong>씬 목록</strong>
        <button type="button" class="icon-button" title="씬 추가">＋</button>
      </div>
      <div class="scene-tools">
        <input id="sceneSearch" type="search" placeholder="씬 검색">
        <select aria-label="씬 종류"><option>전체</option><option>일반 씬</option><option>H씬</option></select>
      </div>
      <div class="chapter-tree">
        <section>
          <button class="chapter-heading" type="button">▾ Chapter 01</button>
          <div class="scene-list">
            <button class="scene-item active" data-scene="N1"><span>N1</span><small>일반 씬</small></button>
            <button class="scene-item" data-scene="H1"><span>H1</span><small>H씬</small></button>
            <button class="scene-item" data-scene="N2"><span>N2</span><small>일반 씬</small></button>
            <button class="scene-item" data-scene="H2"><span>H2</span><small>H씬</small></button>
          </div>
        </section>
        <section>
          <button class="chapter-heading" type="button">▸ Chapter 02</button>
        </section>
      </div>
      <div class="scene-summary"><span>씬 4</span><span>완료 0</span></div>
    </aside>

    <main class="workspace">
      <div class="workspace-header">
        <div>
          <div class="breadcrumb">Chapter 01 / <span id="sceneBreadcrumb">N1</span></div>
          <h1 id="sceneTitle">N1 대사 편집</h1>
        </div>
        <div class="workspace-actions">
          <button type="button">씬 정보</button>
          <button type="button">변경 이력</button>
          <button type="button" class="primary">저장</button>
        </div>
      </div>

      <div class="phase-tabs" role="tablist">
        <button class="phase-tab active" type="button">전체</button>
        <button class="phase-tab" type="button">도입</button>
        <button class="phase-tab" type="button">전개</button>
        <button class="phase-tab" type="button">마무리</button>
      </div>

      <div class="filterbar">
        <input type="search" placeholder="대사·원문·행 ID 검색">
        <select><option>전체 화자</option><option>서희</option><option>준형</option><option>나레이션</option></select>
        <select><option>전체 상태</option><option>미번역</option><option>번역 완료</option><option>검수 필요</option><option>완료</option></select>
        <label><input type="checkbox"> 대본 불일치만</label>
        <label><input type="checkbox"> 음성 누락만</label>
      </div>

      <div class="table-wrap">
        <table class="line-table">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" aria-label="전체 선택"></th>
              <th class="col-id">행 ID</th>
              <th class="col-speaker">화자</th>
              <th>일본어 원문</th>
              <th>영어 번역</th>
              <th>한국어 대사</th>
              <th>녹음용 대본</th>
              <th class="col-status">음성</th>
              <th class="col-status">CG</th>
              <th class="col-status">상태</th>
            </tr>
          </thead>
          <tbody id="lineTableBody">
            <tr class="empty-row">
              <td colspan="10">
                <strong>등록된 대사가 없습니다.</strong>
                <span>씬을 선택하고 데이터를 추가하면 이곳에 표시됩니다.</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer"><span>0개 행</span><span>선택 0</span><span>수정 0</span></div>
    </main>

    <aside class="detail-panel">
      <div class="panel-heading"><strong>선택 행 상세</strong><button class="icon-button" type="button">×</button></div>
      <div class="detail-tabs">
        <button class="detail-tab active" type="button">대사</button>
        <button class="detail-tab" type="button">음성</button>
        <button class="detail-tab" type="button">CG</button>
        <button class="detail-tab" type="button">이력</button>
      </div>
      <div class="detail-empty">
        <div class="empty-icon">□</div>
        <strong>선택된 행이 없습니다.</strong>
        <p>대사 표에서 행을 선택하면 원문, 번역, 대본, 음성 및 연결 CG 정보를 편집할 수 있습니다.</p>
      </div>
      <div class="detail-checklist">
        <strong>씬 작업 현황</strong>
        <label><input type="checkbox"> 번역 완료</label>
        <label><input type="checkbox"> 대본 반영 완료</label>
        <label><input type="checkbox"> 음성 검수 완료</label>
        <label><input type="checkbox"> CG 연결 완료</label>
      </div>
    </aside>
  </div>

  <footer class="statusbar">
    <span class="status-dot"></span><span>로컬 데이터 연결 대기</span><span class="status-spacer"></span><span>자동 저장: 사용</span><span>마지막 저장: 없음</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
